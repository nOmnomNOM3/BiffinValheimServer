# Setting type: Int32
# Default value: 5000
NagleMicros = 5000

## Bytes Steam will buffer per connection before it starts refusing sends (k_ESteamNetworkingConfig_SendBufferSize). 0 = leave Steam's default (512 KB) alone, which is the right answer unless SendQueueGuard is reporting drops; 2097152 (2 MB) is a sane raised value for a server pushing 256 KB budgets to several peers. A bigger buffer buys burst headroom, not bandwidth - it cannot make a link faster, it can only delay the moment a send is refused.
# Setting type: Int32
# Default value: 0
SendBufferBytes = 0

