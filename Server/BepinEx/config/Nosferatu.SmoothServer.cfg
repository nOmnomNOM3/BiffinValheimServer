Statics = Destructible,MineRock5,MineRock,WearNTear,TreeBase,TreeLog

[Compression]

## zstd-compress every ZSteamSocket payload, using a dictionary trained on real Valheim traffic. Both ends must run SmoothServer for a peer to be framed; a vanilla joiner silently stays uncompressed, so this is safe to leave on. || PROFILE: this key is overridden while [Profiles] Profile=FastLink, and forced back to the default above while Profile=Default. Set Profile=Custom if you want to hand-tune it.
# Setting type: Boolean
# Default value: true
Enabled = true

## Payloads smaller than this are sent raw (tag 0x00). Small packets do not compress usefully and the CPU is better spent elsewhere. Vanilla-equivalent: infinity.
# Setting type: Int32
# Default value: 256
MinBytes = 256

## zstd compression level (1-9). 1 is what BetterNetworking used and is the right answer for a real-time transport: almost all of the ratio, almost none of the CPU.
# Setting type: Int32
# Default value: 1
Level = 1

## Compress with the 512 KB trained dictionary instead of the 110 KB one. Slightly better ratio, 512 KB more resident memory per process. Both dictionaries are always loaded for DEcompression, so peers may disagree on this without any loss of compatibility - the frame tag says which one each message used.
# Setting type: Boolean
# Default value: false
UseBigDictionary = false

## Diagnostic: at load, run the two-peer handshake through an in-process simulation (caps/ready ordering, a two-sided disable after a bad frame, a proto mismatch) and log one PASS/FAIL line per case. Touches no sockets and changes no behaviour. Machine-local, never synced. Leave off.
# Setting type: Boolean
# Default value: false
SelfTest = false

