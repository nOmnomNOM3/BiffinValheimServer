# Default value: true
ForceFlushOnChange = true

## Which static object families claim-on-hit applies to, by component type name. Character is deliberately NOT supported in this version (see the module docs: duplicate loot and AI hiccups need Stage 2's hysteresis first). Changing this needs a restart - the patches are installed at load.
