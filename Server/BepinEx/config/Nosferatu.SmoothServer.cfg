## Settings file was created by plugin SmoothServer v0.6.0
## Plugin GUID: Nosferatu.SmoothServer

[AdaptiveBudget]

## Replace SendBudget's single HighWaterBytes number with a per-peer target derived from that peer's live RTT and throughput, backing off on real congestion.
# Setting type: Boolean
# Default value: true
Enabled = true

## Never budget a peer below this many bytes. Vanilla is 10240 for everyone. || PROFILE: this key is overridden while [Profiles] Profile=FastLink, and forced back to the default above while Profile=Default. Set Profile=Custom if you want to hand-tune it.
# Setting type: Int32
# Default value: 16384
FloorBytes = 16384

## Never budget a peer above this many bytes. Steam's own send queue starts erroring well above this; 128KB is a deliberate safety margin. || PROFILE: this key is overridden while [Profiles] Profile=FastLink, and forced back to the default above while Profile=Default. Set Profile=Custom if you want to hand-tune it.
# Setting type: Int32
# Default value: 131072
CeilingBytes = 131072

## Multiplier on the bandwidth-delay product (outBytesPerSec * RTT). 1.0 exactly fills the pipe; 2.0 leaves headroom for bursts. Clamped to 0.5-8.
# Setting type: Single
# Default value: 2
K = 2

## Back off while a peer's Steam-side PENDING bytes (queued, not yet on the wire) exceed this. In-flight/unacked bytes deliberately do NOT trigger a back-off.
# Setting type: Int32
# Default value: 8192
PendingBackoffBytes = 8192

## EMA factor for the per-peer target. 1.0 = react instantly, 0.1 = very smooth.
# Setting type: Single
# Default value: 0.3
Smoothing = 0.3

## Seconds between per-peer budget lines. 0 disables the log line.
# Setting type: Single
# Default value: 10
LogIntervalSec = 10

## Legacy application path, OFF by default. Since 0.3.0 SendBudget's GetHighWaterBytes() calls AdaptiveBudgetModule.HighWaterFor() directly, so the per-peer budget already applies. true additionally swaps SendBudgetModule.HighWaterBytes around each ZDOMan.SendZDOs call - only useful if that hook call is ever removed. It is a prefix/finalizer that writes a FIELD; it never rewrites IL, so it can neither help nor hurt when another mod has transpiled ZDOMan.SendZDOs (issue #2). Either way, this module only has an effect while SendBudget itself is applied.
# Setting type: Boolean
# Default value: false
UseCallSiteSwap = false

[AsyncSave]

## Measure the main-thread world-save stall and shrink it. Vanilla already writes the file on a background thread; the stall is ZDOMan.PrepareSave's ZDO clone.
# Setting type: Boolean
# Default value: true
Enabled = true

## Pre-size ZDOMan.GetSaveClone()'s list from the live ZDO count instead of letting it grow from zero. Same output, no reallocation storm on the main thread.
# Setting type: Boolean
# Default value: true
PreSizeClone = true

## Log one line per world save with the main-thread stall and the background-thread time.
# Setting type: Boolean
# Default value: true
LogStalls = true

## 0 = off. Above 0: this many seconds after the world is up AND with 0 peers connected, force two saves - one with PreSizeClone off, one on - and log both stalls and the delta. Headless proof; leave at 0 in production.
# Setting type: Single
# Default value: 0
SelfTestSeconds = 0

