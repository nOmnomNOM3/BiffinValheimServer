[CombatOwnership]

## Take ownership of a static object (ore, tree, vine, building piece) the moment you hit it, so your damage is applied on your own machine instead of travelling to whichever player's PC happens to simulate it. Client-side; creatures are never claimed.
# Setting type: Boolean
# Default value: true
Enabled = true

## Never claim an object further than this (metres) from your player. Keeps a stray long-range hit from moving ownership of something you are not really fighting.
# Setting type: Single
# Default value: 16
MaxDistance = 16

## Never claim inside a ward you do not have access to. Leave this on: after a claim the ward's own alarm (PrivateArea.OnObjectDamaged) runs on YOUR machine, because it runs on the owner.
# Setting type: Boolean
# Default value: true
RequirePrivateAreaAccess = true

## Never claim a building piece whose current owner is another player who is online - they are probably building with it.
# Setting type: Boolean
# Default value: true
SkipPiecesOwnedByOnlinePeer = true

## Never claim anything parented to a ship or a cart. Ownership of a rigidbody vehicle is what every previous mod in this space broke first. Leave this on.
# Setting type: Boolean
# Default value: true
ExcludeShipsAndVagons = true

## After a claim, push the changed ZDO to the front of the next sync list and nudge the send timer, so everyone else sees the new owner and the new health a tick sooner. This is vanilla's own claim-then-ForceSendZDO pattern (Container.cs:448).
