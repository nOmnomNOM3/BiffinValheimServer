[SmoothMotion]

## CLIENT ONLY, OFF BY DEFAULT. Tune how other players' and mobs' movement is interpolated on YOUR screen. Purely cosmetic and purely local: it changes nothing that is sent, stored or simulated, only how this client draws objects it does not own between the updates it receives. Turn it on, play for ten minutes, turn it off again if you cannot tell the difference.
# Setting type: Boolean
# Default value: false
Enabled = false

## How much of the gap to the target position a non-owned object closes on each physics tick (50/s). Vanilla 0.2. Higher = snappier and more responsive but twitchier on a lossy link; lower = smoother but laggier. This is a fraction per tick, not a speed, and it is not scaled by frame time - vanilla's is not either. Clamped to 0.05-1.0 (1.0 = no smoothing at all, snap straight to the target). Machine-local: it describes YOUR screen, not the server's.
# Setting type: Single
# Default value: 0.2
InterpolationFactor = 0.2

## How far ahead, in milliseconds, a non-owned object may be predicted along its last known velocity while no fresh update has arrived. VANILLA IS 2000 - Valheim already dead-reckons, this knob only caps it. 0 = no prediction at all (objects lag by up to one update but never overshoot); 150-400 is the interesting range for a low-latency group: enough to hide one lost packet, not enough to produce the rubber-band snap when someone stops dead. Clamped to 0-2000. Machine-local.
# Setting type: Int32
# Default value: 2000
ExtrapolateMs = 2000

## Which non-owned objects the two knobs above apply to. Characters = players and mobs only (everything else keeps vanilla's 0.2 / 2000ms exactly). All = every synced object, including carts, ships and dropped items. Start with Characters. Objects you own are never touched on any setting - vanilla's own `if (zdo.IsOwner()) return;` runs first. Machine-local.
# Setting type: MotionTargets
# Default value: Characters
# Acceptable values: Characters, All
