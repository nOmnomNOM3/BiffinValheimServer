[PriorityLane]

## Shape this machine's outgoing Steam traffic: hold the backlog in a managed priority queue and hand Steam only about one bandwidth-delay product at a time, so a hit RPC no longer waits behind tens of kilobytes of bulk ZDO data inside Steam's own buffer. Send ORDER only - every byte stays vanilla-legal, so unmodded clients benefit too. OFF by default in 0.6.0 (not yet measured with real players); turning it on needs a restart.
# Setting type: Boolean
# Default value: false
Enabled = false

## How many bytes may be outstanding towards Steam for one peer before this machine holds the rest back in its own priority queue. About one bandwidth-delay product: the residual head-of-line delay a latency-critical package can suffer is roughly this / the peer's bandwidth (6144 B at ~250 KB/s = ~25 ms). Lower = lower latency, more send calls; too low costs throughput. 0 = shaping OFF (hot marking and FastFlushOnDamage still work). || PROFILE: this key is overridden while [Profiles] Profile=FastLink, and forced back to the default above while Profile=Default. Set Profile=Custom if you want to hand-tune it.
# Setting type: Int32
# Default value: 6144
SteamInflightBytes = 6144

## How long an object stays 'hot' after it was damaged. While hot, the ZDO update carrying its new health is force-sent to the attacker and its package is sent ahead of bulk traffic.
# Setting type: Int32
# Default value: 1500
HotWindowMs = 1500

## On the machine that OWNS a damaged object, force the changed ZDO to the front of the next sync list and nudge the send timer, instead of waiting up to a full client send tick (~50 ms). Owner-side only; costs one hash-set add per hit.
# Setting type: Boolean
# Default value: true
FastFlushOnDamage = true

## Only send a routed RPC ahead of bulk traffic when the receiving peer provably already has the RPC's target ZDO. Vanilla silently DROPS a routed RPC whose target ZDO it does not know, so an RPC that overtook the ZDO creating its object would be lost. Leave this on.
# Setting type: Boolean
# Default value: true
RequireKnownZdo = true

## Comma-separated routed-RPC method names that are never promoted, whatever else says. DestroyZDO must stay here: promoted, a destroy could overtake the ZDOData that creates the object and the receiver would re-create it as a ghost. Compression's own SS_Caps/SS_Ready/SS_Off are always treated as ordering barriers and need not be listed.
# Setting type: String
# Default value: DestroyZDO
DenyListedRpcs = DestroyZDO

## Starvation guard: at most this many priority bytes are handed to Steam before bulk traffic gets its turn within one drain.
# Setting type: Int32
# Default value: 8192
MaxPrioBytesPerDrain = 8192

## Comma-separated routed-RPC method names whose target object becomes 'hot' (see HotWindowMs). These are vanilla's three damage entry points.
# Setting type: String
# Default value: RPC_Damage,Hit,RPC_Hit
HotMethods = RPC_Damage,Hit,RPC_Hit

